name: build-and-publish-repo

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
#    env:
#      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts fakeroot \
            reprepro dpkg-dev lintian

      - name: Build packages
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

          shopt -s nullglob
          for d in */ ; do
            if [ ! -f "$d/debian/control" ]; then
              continue
            fi

            echo "Building $d"
            (
              cd "$d"
              dpkg-buildpackage -us -uc -b
            )

            cp -v ./*.deb ../out/ 2>/dev/null || true
            cp -v ./*.dsc ../out/ 2>/dev/null || true
            cp -v ./*.tar.* ../out/ 2>/dev/null || true
            cp -v ./*.changes ../out/ 2>/dev/null || true
            cp -v ./*.buildinfo ../out/ 2>/dev/null || true
          done

      - name: Initialize reprepro repo
        run: |
          mkdir -p repo/conf
          cat > repo/conf/distributions <<'EOF'
          Origin: GitHub
          Label: Leggewie GitHub APT Repo
          Suite: stable
          Codename: generic
          Architectures: amd64 arm64 armhf all
          Components: main
          Description: PPA-like repository built from GitHub Actions
          SignWith: no
          EOF

      - name: Import packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          for deb in out/*.deb; do
            reprepro -b repo includedeb generic "$deb"
          done

          for dsc in out/*.dsc; do
            reprepro -b repo includedsc generic "$dsc"
          done

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
