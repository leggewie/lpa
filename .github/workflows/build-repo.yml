name: build and publish LPA apt repo

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  RELEASE: generic
  SUPPORTED_ARCHES: amd64 arm64 armhf
  SIGNING_KEY: 104C6DC95DD59599A96FD9F82777C04CF040B50D

jobs:

  # dpkg-parsechangelog -S Version # FTW
  check-published:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: List published packages
        run: |
          set -euxo pipefail
          # XXX: better check the InRelease files
          find pool/main -name '*.dsc' | sort > published-packages.txt
          cat published-packages.txt
#      - uses: actions/upload-artifact@v4
#        with:
#          name: published-packages
#          path: published-packages.txt

########################################################

  importGPG:
    runs-on: ubuntu-24.04
    # github secrets are really stupid
    environment: test
    steps:
      - name: Install repository tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg gpg-agent

      - name: Import GPG signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$REPO_SIGNING_KEY" | wc -l
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "ERROR: REPO_SIGNING_KEY secret is not set or empty"
            exit 1
          fi

          echo "$REPO_SIGNING_KEY" | gpg --batch --import

      - name: Configure gpg-agent for signing
        env:
          GPG_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          cat > ~/.gnupg/gpg-agent.conf <<'EOF'
          allow-loopback-pinentry
          default-cache-ttl 3600
          max-cache-ttl 86400
          EOF
          gpgconf --kill gpg-agent || true

          # Give gpg-agent time to restart
          sleep 1

          # Unlock the key by signing a test file - this caches the passphrase
          echo "test" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --sign  > /dev/null
          # Passphrase is now cached in gpg-agent for this session



########################################################


  source:
    needs: [importGPG, check-published]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            lintian

      - name: Build source and all packages
        run: |
          set -euxo pipefail
          shopt -s nullglob

          mkdir -p out/source

          for pkgdir in */; do
            if [[ -f "${pkgdir}debian/control" ]]; then
              (cd "$pkgdir" && dpkg-buildpackage -g -us -uc)
              mv -v *.dsc *.debian.tar.* *.orig.tar.* *.changes *.buildinfo out/source/ || true
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: out/source/

  build_any:
    needs: [importGPG, check-published]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
            host_arch: amd64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            host_arch: arm64
          - arch: armhf
            runs_on: ubuntu-24.04-arm
            host_arch: armhf
            extra_args: --host-arch=armhf
    runs-on: ${{ matrix.runs_on }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture ${{ matrix.host_arch }}
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            lintian \
            crossbuild-essential-armhf

      - name: Build arch-dependent packages
        run: |
          set -euxo pipefail
          shopt -s nullglob

          mkdir -p out/binary-${{ matrix.arch }}

          for pkgdir in */; do
            if [[ -f "${pkgdir}debian/control" ]]; then
              (cd "$pkgdir" && dpkg-buildpackage -B -us -uc -a${{ matrix.arch }} ${{ matrix.extra_args }})
              mv -v *.deb *.changes *.buildinfo out/binary-${{ matrix.arch }}/ || true
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/binary-${{ matrix.arch }}/

  publish:
    needs: [source, build_any]
    environment: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install repository tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg gpg-agent

      - name: Import GPG signing key and prepare GPG agent
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$REPO_SIGNING_KEY" | gpg --batch --import

          cat > ~/.gnupg/gpg-agent.conf <<'EOF'
          allow-loopback-pinentry
          default-cache-ttl 600
          max-cache-ttl 3600
          no-tty
          EOF

          # Unlock the key by signing a test stream - this caches the passphrase
          echo "test" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --sign > /dev/null
          # Passphrase is now cached in gpg-agent for this session

      # reprepro does not understand the 'all' architecture specification
      # specifically list all published arches instead. https://serverfault.com/questions/279153/
      - name: Prepare reprepro repository
        run: |
          set -euxo pipefail
          mkdir -p repo/conf

          cat > repo/conf/distributions <<EOF
          Origin: GitHub
          Label: LPA GitHub apt repo
          Suite: stable
          Codename: generic
          Architectures: amd64 arm64 armhf source
          Components: main
          Description: PPA-like LPA repository built from GitHub Actions
          SignWith: ${SIGNING_KEY}
          EOF

      - name: Import packages
        run: |
          set -euxo pipefail
          shopt -s nullglob
          find artifacts -name '*.deb' -print0 | xargs -0 -r reprepro -b repo includedeb generic
          find artifacts -name '*.dsc'
          find artifacts -name '*.dsc' -exec cat {} \;
          echo "content of dsc files above this line"
          find artifacts -name '*.dsc' -print0 | xargs -0 -r reprepro -S source -P optional -b repo includedsc generic
          find repo/ # XXX: for verification
          rm -Rf ./repo/conf/ ./repo/db/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
